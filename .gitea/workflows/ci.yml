name: CI and image

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

env:
  PUSH_IMAGE: zot-push.lab.ddupan.top/panxiao81/ai-gateway-keys

jobs:
  verify:
    runs-on: [self-hosted, pod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm test

  # Job key "image" -> SPIFFE ID spiffe://ddupan.top/ci/panxiao81/ai-gateway-keys/image,
  # which zot allows to push this repository (homelab-infra apps/zot/values.yaml).
  image:
    # Manual dispatch on main also publishes, e.g. to retry a push the flaky WAN broke.
    if: gitea.event_name != 'pull_request' && gitea.ref == 'refs/heads/main'
    needs: verify
    runs-on: [self-hosted, pod]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Zot with a short-lived JWT-SVID
        shell: bash
        run: |
          set -euo pipefail
          set +x
          docker_config="$(mktemp -d)"
          jwt_file="$(mktemp)"
          trap 'rm -f -- "$jwt_file"' EXIT
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >>"$GITHUB_ENV"
          spire-agent api fetch jwt -audience zot \
            -socketPath /run/spire/agent-sockets/spire-agent.sock -output json >"$jwt_file"
          jq -er '.[0].svids[0].svid' "$jwt_file" | \
            DOCKER_CONFIG="$docker_config" docker login zot-push.lab.ddupan.top --username zot --password-stdin
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Flux tracks the digest behind :latest (homelab-infra platform/flux-image-automation).
          tags: ${{ env.PUSH_IMAGE }}:latest
      - run: echo "pushed ${{ env.PUSH_IMAGE }}@${{ steps.build.outputs.digest }}"
      - name: Remove registry credentials
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
